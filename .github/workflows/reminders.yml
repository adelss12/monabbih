name: تنبيهات الانتهاء بالبريد

on:
  schedule:
    # كل يوم الساعة 8 صباحًا بتوقيت الرياض (5:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'وضع الاختبار: أرسل كل ما هو داخل فترة التنبيه الآن'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --omit=dev
      - run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_MODE: ${{ inputs.test || 'false' }}
