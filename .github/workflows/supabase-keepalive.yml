
name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read database safely
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          
          status=$(curl --silent --show-error \
            --max-time 30 \
            --get \
            --url "$SUPABASE_URL/rest/v1/items" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --output /dev/null \
            --write-out "%{http_code}")

          echo "Supabase HTTP status: $status"
          test "$status" = "200"

          echo "Supabase read request completed."
